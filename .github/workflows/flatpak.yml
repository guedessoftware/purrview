name: Flatpak CI

on:
  push:
    paths:
      - CMakeLists.txt
      - VERSION
      - cmake/**
      - packaging/flatpak/**
      - qml/**
      - resources/**
      - src/**
      - .github/workflows/flatpak.yml
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Sdk//6.10 org.kde.Platform//6.10

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            build-flatpak packaging/flatpak/io.github.impage.Impage.yml

      - name: Validate metadata
        run: |
          appstreamcli validate --no-net \
            build-flatpak/files/share/metainfo/io.github.impage.Impage.metainfo.xml
          desktop-file-validate \
            build-flatpak/files/share/applications/io.github.impage.Impage.desktop

      - name: Create bundle
        run: |
          version="$(<VERSION)"
          flatpak build-bundle flatpak-repo "Impage-${version}-x86_64.flatpak" \
            io.github.impage.Impage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Impage-Flatpak
          path: Impage-*.flatpak
