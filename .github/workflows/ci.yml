name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            preset: asan
            test-environment: ASAN_OPTIONS=detect_leaks=1
          - name: UndefinedBehaviorSanitizer
            preset: ubsan
            test-environment: UBSAN_OPTIONS=print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build pkg-config qt6-base-dev qt6-declarative-dev
          qt6-image-formats-plugins libcups2-dev libxkbcommon-dev libexiv2-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ${{ matrix.test-environment }} ctest --preset ${{ matrix.preset }}

  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 LTS
            container: ubuntu:26.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              build-essential cmake ninja-build pkg-config git qt6-base-dev qt6-declarative-dev
              qt6-image-formats-plugins libcups2-dev libxkbcommon-dev libexiv2-dev appstream
              desktop-file-utils xdg-utils kimageformat6-plugins
          - name: Debian 13
            container: debian:13-slim
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              build-essential cmake ninja-build pkg-config git qt6-base-dev qt6-declarative-dev
              qt6-image-formats-plugins libcups2-dev libxkbcommon-dev libexiv2-dev appstream
              desktop-file-utils xdg-utils kimageformat6-plugins
          - name: Fedora 44
            container: fedora:44
            install: >-
              dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config git
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtimageformats exiv2-devel
              cups-devel libxkbcommon-devel appstream desktop-file-utils xdg-utils
              kf6-kimageformats libavif
          - name: Arch Linux
            container: archlinux:base-devel
            install: >-
              pacman -Syu --noconfirm --needed cmake ninja pkgconf git qt6-base qt6-declarative
              qt6-imageformats cups libxkbcommon exiv2 appstream desktop-file-utils xdg-utils
              kimageformats libavif libheif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: QML lint
        run: cmake --build build/release --target purrview_qmllint

      - name: Validate release metadata
        shell: bash
        run: |
          scripts/validate-release.sh
          ./build/release/purrview --version
          appstreamcli validate --no-net build/release/generated/io.github.guedessoftware.PurrView.metainfo.xml
          desktop-file-validate resources/linux/io.github.guedessoftware.PurrView.desktop
          desktop-file-validate resources/linux/io.github.guedessoftware.PurrView.Viewer.desktop

      - name: Headless QML smoke test
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            timeout --signal=TERM 3s ./build/release/purrview
          status=$?
          set -e
          [[ "${status}" -eq 124 || "${status}" -eq 143 ]]

      - name: Bootstrap lifecycle
        shell: bash
        run: |
          bootstrap_home="${RUNNER_TEMP}/purrview-bootstrap-home"
          mkdir -p "${bootstrap_home}"
          HOME="${bootstrap_home}" scripts/install-purrview.sh --check --non-interactive
          HOME="${bootstrap_home}" scripts/install-purrview.sh --user --non-interactive
          HOME="${bootstrap_home}" "${bootstrap_home}/.local/bin/purrview" --version
          HOME="${bootstrap_home}" "${bootstrap_home}/.local/bin/impage" --version
          HOME="${bootstrap_home}" scripts/install-purrview.sh --user --upgrade --non-interactive
          HOME="${bootstrap_home}" scripts/install-purrview.sh --user --uninstall --non-interactive
          test ! -e "${bootstrap_home}/.local/opt/purrview"
